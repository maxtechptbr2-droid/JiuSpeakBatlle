<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Dark Blue Cinematic Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#030c1e" />
      <stop offset="50%" stop-color="#010611" />
      <stop offset="100%" stop-color="#000205" />
    </radialGradient>

    <!-- Glowing Blue Spotlights -->
    <radialGradient id="blueGlow" cx="50%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#00bfff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="leftSpot" cx="20%" cy="10%" r="50%">
      <stop offset="0%" stop-color="#009dff" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="rightSpot" cx="80%" cy="10%" r="50%">
      <stop offset="0%" stop-color="#0033aa" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Linear Grid pattern for sport arenas -->
    <pattern id="arenaGrid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="#009dff" stroke-width="1" stroke-opacity="0.08" />
    </pattern>
  </defs>

  <!-- Ground Background layer -->
  <rect width="1920" height="1080" fill="url(#bgGrad)" />

  <!-- Grid perspective and architecture -->
  <rect width="1920" height="1080" fill="url(#arenaGrid)" opacity="0.6" />

  <!-- Dark Vignette and depth overlay -->
  <rect width="1920" height="1080" fill="url(#blueGlow)" />
  <rect width="1920" height="1080" fill="url(#leftSpot)" />
  <rect width="1920" height="1080" fill="url(#rightSpot)" />

  <!-- Sport Spotlight Cones (Lasers) -->
  <polygon points="100,0 350,1080 0,1080" fill="none" stroke="url(#bgGrad)" opacity="0" />
  <path d="M100,0 L500,1080" stroke="#00bfff" stroke-width="4" stroke-opacity="0.1" filter="blur(10px)" />
  <path d="M1820,0 L1420,1080" stroke="#009dff" stroke-width="3" stroke-opacity="0.08" filter="blur(8px)" />

  <!-- Subtle star arena particles -->
  <circle cx="250" cy="180" r="2" fill="#fff" opacity="0.5" />
  <circle cx="450" cy="580" r="3" fill="#00bfff" opacity="0.4" />
  <circle cx="850" cy="320" r="1.5" fill="#fff" opacity="0.6" />
  <circle cx="1200" cy="650" r="4" fill="#009dff" opacity="0.3" />
  <circle cx="1600" cy="220" r="2.5" fill="#fff" opacity="0.4" />
  <circle cx="1750" cy="480" r="1" fill="#fff" opacity="0.5" />
</svg>
