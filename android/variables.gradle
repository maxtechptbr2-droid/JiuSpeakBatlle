// Versões compartilhadas por TODOS os módulos (app + plugins do Capacitor).
// Publicar em `allprojects` garante que o app e cada plugin usem EXATAMENTE o
// mesmo compileSdk/targetSdk/minSdk (fonte única), evitando o erro
// "No matching variant" causado por módulos que caíam em valores de fallback isolados.
allprojects {
    ext {
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        androidxActivityVersion = '1.11.0'
        androidxAppCompatVersion = '1.7.1'
        androidxCoordinatorLayoutVersion = '1.3.0'
        androidxCoreVersion = '1.17.0'
        androidxFragmentVersion = '1.8.9'
        coreSplashScreenVersion = '1.2.0'
        androidxWebkitVersion = '1.14.0'
        junitVersion = '4.13.2'
        androidxJunitVersion = '1.3.0'
        androidxEspressoCoreVersion = '3.7.0'
        cordovaAndroidVersion = '14.0.1'
    }
}
