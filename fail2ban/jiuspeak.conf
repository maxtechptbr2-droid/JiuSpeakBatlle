# Fail2ban jail & filter configuration for JiuSpeak Platform
# OS: Ubuntu 24.04 LTS (Fail2ban Server)

# --- 1. CONFIGURAÇÃO DA JAIL (Place inside /etc/fail2ban/jail.d/jiuspeak.local) ---
[jiuspeak]
enabled  = true
port     = http,https
filter   = jiuspeak-auth
logpath  = /var/log/nginx/jiuspeak_access.log
backend  = auto
maxretry = 5           # Banir após 5 falhas consecutivas de login
findtime = 600         # Janela de análise de 10 minutos (600s)
bantime  = 3600        # Ban de 1 hora (3600s) para o IP agressor
action   = iptables-multiport[name=jiuspeak, port="http,https"]


# --- 2. CONFIGURAÇÃO DO FILTRO (Place inside /etc/fail2ban/filter.d/jiuspeak-auth.conf) ---
# O filtro rastreia repetições de tentativas com códigos 401 ou 451 (Tentativas no admin ou login incorreto)

[Definition]
failregex = ^<HOST> - - \[.*\] "POST /api/auth/login HTTP/.*" 401
            ^<HOST> - - \[.*\] "POST /api/admin/.* HTTP/.*" 403
            ^<HOST> - - \[.*\] "POST /api/admin/.* HTTP/.*" 451

ignoreregex = 
