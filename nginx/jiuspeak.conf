# Nginx configuration for JiuSpeak Platform on Ubuntu 22/24
# Place at: /etc/nginx/sites-available/jiuspeak.conf
# Enable via: ln -s /etc/nginx/sites-available/jiuspeak.conf /etc/nginx/sites-enabled/

# HTTP - Redirect all traffic to HTTPS (www.jiuspeak.com.br)
server {
    listen 80;
    listen [::]:80;
    server_name jiuspeak.com.br www.jiuspeak.com.br;

    return 301 https://www.jiuspeak.com.br$request_uri;
}

# HTTPS - Redirect naked domain to www for canonical SEO
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name jiuspeak.com.br;

    # SSL Certificates (Generated with Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/jiuspeak.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jiuspeak.com.br/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384";
    ssl_prefer_server_ciphers off;

    return 301 https://www.jiuspeak.com.br$request_uri;
}

# HTTP MAIN HTTPS Server block (www.jiuspeak.com.br)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.jiuspeak.com.br;

    # SSL Certificates Configuration (Gerados com Certbot)
    ssl_certificate /etc/letsencrypt/live/jiuspeak.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jiuspeak.com.br/privkey.pem;

    # SSL Session settings
    ssl_session_cache shared:le_nginx_SSL:10m;
    ssl_session_timeout 1440m;
    ssl_session_tickets off;

    # SSL Protocols and Ciphers (Modern and Secure profiles)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384";

    # Security Headers (Strengthen server configuration)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline' 'unsafe-eval'; frame-ancestors 'self';" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Client limits (Prevent payload size inflation)
    client_max_body_size 20M;

    # Reverse proxy to the Node.js Express server on port 3000
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        
        # Mandatory WebSocket headers for Socket.io
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Real-IP forwarding headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts to handle longer calculations
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Custom static assets cache rules
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|otf|ttf|svg|webp)$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Custom logs paths
    access_log /var/log/nginx/jiuspeak_access.log;
    error_log /var/log/nginx/jiuspeak_error.log warn;
}
