# =========================================================================
# JIUSPEAK BJJ - PRODUCTION NGINX SERVER CONFIGURATION
# =========================================================================

# Rate limiting zones declaration
limit_req_zone $binary_remote_addr zone=api_limit_zone:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit_zone:10m;

upstream app_backend {
    server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name jiuspeak.com.br www.jiuspeak.com.br;

    # Enforce safe global HTTPS redirect
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name jiuspeak.com.br www.jiuspeak.com.br;

    # SSL TLS Standard Configurations (Mozilla Modern Compatibility)
    ssl_certificate /etc/letsencrypt/live/jiuspeak.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jiuspeak.com.br/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Diffie-Hellman Parameter configuration
    # ssl_dhparam /etc/nginx/ssl/dhparam.pem;

    # Cryptographic profile hardening
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # HTTP Strict Transport Security (HSTS)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Professional Integrity Headers & Security Hardening
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline' 'unsafe-eval';" always;

    # Upload metrics and maximum asset payload scale (32MB)
    client_max_body_size 32M;

    # Advanced GZIP Compression Configuration
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Dynamic file descriptors caching
    open_file_cache max=10000 inactive=30s;
    open_file_cache_valid 2m;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # Proxy Buffer settings optimizations for fast response streaming
    proxy_buffers 8 32k;
    proxy_buffer_size 64k;
    proxy_busy_buffers_size 128k;
    proxy_temp_file_write_size 256k;
    proxy_connect_timeout 60s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    # Client connections boundaries
    limit_conn conn_limit_zone 40;

    # Forwarding location routes to PM2 App instances
    location / {
        proxy_pass http://app_backend;
        
        # Keepalive reuse
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Standard routing headers matching client specs
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Upgrade negotiation headers for WebSockets compatibility
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Custom rate limits applied strictly on sensitive API endpoints
    location /api/ {
        limit_req zone=api_limit_zone burst=20 nodelay;
        
        proxy_pass http://app_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static file asset distribution caching directly via Nginx
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff|woff2|ttf|otf)$ {
        proxy_pass http://app_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        
        expires 30d;
        access_log off;
        add_header Cache-Control "public, no-transform";
    }

    # Custom 502 error redirect
    error_page 502 /502.html;
    location = /502.html {
        root /var/www/jiuspeakbatlle/public;
        internal;
    }
}
